    <h1>Contact us</h1>
    <p>On this page you can contact me for any information you may need about this sight or its purpose</p>

    <div class="container">
        <form action="mailto:danielwears5@gmail.com" method="post" enctype="text/plain">
            <label for="fname">First name:</label><br>
            <input type="text" id="fname" name="fname"><br>
            <label for="lname">Last name:</label><br>
            <input type="text" id="lname" name="lname"><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="Email"><br>
            <label for="information">Information:</label><br>
            <input type="text" id="information" name="Information" required><br>
            <input type="submit" value="Send" onclick="formSubmit()">
        </form>
    </div>

    <!-- The Modal -->
    <div id="myModal" class="modal">

        <!-- Modal content -->
        <div class="modal-content">
            <button onclick="closeModal()" class="close">&times;</button>
